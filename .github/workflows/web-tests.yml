# Runs the website tests on every push to main and pull request that changes what they cover.
# They build their own site from the fixture export (apps/web/test/fixtures/public-data.mjs), so no
# database, export, or secrets are needed.
name: Web tests
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'scripts/check_export.py'
      - 'scripts/check_site.py'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'scripts/check_export.py'
      - 'scripts/check_site.py'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check the site
        run: npm run check
      # Builds the test site (validated by scripts/check_export.py) into .test-site/, then runs the tests.
      - name: Run the web tests
        run: npm test
      - name: Check the test site's pages and internal links
        run: python3 ../../scripts/check_site.py --dist .test-site/dist
