<!doctype html>
<!--
  Draft for public/og-image.png, the 1200x630 link preview image, in the Lake Calendar design.
  Re-render after editing (from apps/web):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot="$PWD/public/og-image.png" "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f4f7fa;
    color: #14283c;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .scene { position: absolute; inset: 0; }
  .content { position: absolute; left: 84px; top: 84px; right: 84px; }
  .brand { display: flex; align-items: center; gap: 14px; color: #1d3f5e; font-size: 27px; font-weight: 600; letter-spacing: -.01em; }
  .brand strong { font-weight: 700; }
  .brand svg { width: 48px; height: 48px; fill: none; stroke: #2b5f8c; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 40px 0 0; color: #1d3f5e; font-size: 82px; font-weight: 700; letter-spacing: -.04em; line-height: 1.04; }
  p { margin: 28px 0 0; max-width: 800px; color: #3d5469; font-size: 32px; line-height: 1.32; letter-spacing: -.01em; }
  .url { position: absolute; right: 84px; bottom: 36px; color: #ffffff; font-size: 24px; font-weight: 600; letter-spacing: .005em; }
</style>
</head>
<body>
  <svg class="scene" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3b76a8" />
        <stop offset="1" stop-color="#1d3f5e" />
      </linearGradient>
    </defs>
    <!-- Distant ridge -->
    <path d="M720 540 L812 462 L858 488 L968 318 L1046 404 L1096 366 L1200 446 L1200 540 Z" fill="#dbe8f3" />
    <!-- Middle ridge -->
    <path d="M760 540 L866 452 L914 482 L1020 384 L1088 448 L1142 418 L1200 452 L1200 550 L760 550 Z" fill="#b8cfe3" />
    <!-- Near ridge -->
    <path d="M820 545 L918 494 L962 512 L1050 452 L1122 506 L1200 478 L1200 560 L820 560 Z" fill="#86add0" />
    <!-- Lake -->
    <rect x="0" y="540" width="1200" height="90" fill="url(#lake)" />
    <g stroke="#a9c8e2" stroke-width="2" stroke-linecap="round" opacity=".5">
      <path d="M92 566 h96" /><path d="M248 584 h60" /><path d="M412 562 h120" />
      <path d="M612 590 h70" /><path d="M700 568 h80" />
    </g>
  </svg>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 40 40"><rect x="6" y="8" width="28" height="27" rx="4"/><path d="M6 15h28M14 4v7M26 4v7"/><path d="M12 26c2.5-2 5-2 8 0s5.5 2 8 0"/></svg>
      <span>Tahoe <strong>Public Meetings</strong></span>
    </div>
    <h1>What’s on the agenda<br />around Lake Tahoe</h1>
    <p>Upcoming meetings, agendas, and public comment periods from local agencies, in one place.</p>
  </div>

  <div class="url">tahoepublicmeetings.org</div>
</body>
</html>
