[project]
name = "tahoe-meetings-ingestion"
version = "0.1.0"
description = "Local PostgreSQL ingestion worker for Tahoe public meetings"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
# Claude API client for evaluate-topics live runs; the core worker never imports it.
ai = ["anthropic>=1.10,<2"]

[project.scripts]
tahoe-ingest = "tahoe_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tahoe_ingest"]

[tool.hatch.build.targets.wheel.force-include]
"tahoe_ingest/schema.sql" = "tahoe_ingest/schema.sql"

[tool.hatch.build.hooks.custom]
path = "build_hook.py"
